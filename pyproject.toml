[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depattern"
version = "0.1.0"
description = "A CLI tool to audit formulaic writing patterns, rewrite drafts, and export schema/presentation assets."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["writing", "cli", "markdown", "linting", "ai", "content", "technical-writing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
depattern = "depattern.cli:cli"

[project.urls]
Homepage = "https://github.com/JesseK91/depattern"
Issues = "https://github.com/JesseK91/depattern/issues"
