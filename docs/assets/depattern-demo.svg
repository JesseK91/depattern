<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DePattern CLI visual demo</title>
  <desc id="desc">A terminal-style demo showing DePattern flagging formulaic AI-writing patterns and suggesting clearer edits.</desc>
  <rect width="1200" height="760" rx="28" fill="#0B0F14"/>
  <rect x="1" y="1" width="1198" height="758" rx="27" stroke="#233041" stroke-width="2"/>

  <defs>
    <linearGradient id="accent" x1="96" y1="72" x2="542" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <filter id="shadow" x="38" y="126" width="1124" height="558" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <text x="72" y="78" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="800">DePattern</text>
  <text x="72" y="116" fill="#D8E0EA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500">An AI-pattern linter for serious writing.</text>
  <text x="823" y="88" fill="#7D8A99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">github.com/JesseK91/depattern</text>

  <g filter="url(#shadow)">
    <rect x="72" y="154" width="1056" height="478" rx="18" fill="#101720"/>
    <rect x="72" y="154" width="1056" height="478" rx="18" stroke="#2C3A4A"/>
    <rect x="72" y="154" width="1056" height="54" rx="18" fill="#17202B"/>
    <rect x="72" y="190" width="1056" height="18" fill="#17202B"/>
    <circle cx="105" cy="181" r="7" fill="#F87171"/>
    <circle cx="130" cy="181" r="7" fill="#FBBF24"/>
    <circle cx="155" cy="181" r="7" fill="#34D399"/>
    <text x="190" y="187" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">terminal</text>

    <text x="104" y="250" fill="#8BFAAC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">$ depattern analyze examples/raw.md</text>
    <text x="104" y="296" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">DEPATTERN LINGUISTIC AUDIT: raw.md</text>
    <text x="104" y="334" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Overall Pattern Risk:</text>
    <rect x="350" y="312" width="344" height="34" rx="8" fill="#3B1218"/>
    <text x="366" y="335" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">HIGH RISK - Formulaic Patterning</text>
    <text x="104" y="374" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Pattern Artifact Score:</text>
    <text x="382" y="374" fill="#FACC15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">6/9</text>

    <text x="104" y="426" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">- Banned transitions: furthermore, in conclusion, moreover</text>
    <text x="104" y="462" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">- Abstract nouns: synergy, solutions, paradigm, ecosystem</text>
    <text x="104" y="498" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">- Rhythm issue: flat sentence length variance</text>

    <text x="104" y="558" fill="#8BFAAC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">$ depattern suggest examples/raw.md</text>
    <text x="104" y="596" fill="#F97316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">1. Replace formulaic transition language</text>
    <text x="104" y="624" fill="#D8E0EA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Cut the transition or replace it with a concrete claim.</text>
  </g>

  <g>
    <rect x="72" y="666" width="330" height="44" rx="12" fill="#17202B" stroke="#2C3A4A"/>
    <text x="94" y="694" fill="#D8E0EA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Offline analysis</text>
    <rect x="432" y="666" width="330" height="44" rx="12" fill="#17202B" stroke="#2C3A4A"/>
    <text x="454" y="694" fill="#D8E0EA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">JSON output for automation</text>
    <rect x="792" y="666" width="336" height="44" rx="12" fill="#17202B" stroke="#2C3A4A"/>
    <text x="814" y="694" fill="#D8E0EA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Optional LLM rewrite pipeline</text>
  </g>
</svg>

